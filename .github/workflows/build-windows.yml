name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify imports
        shell: pwsh
        run: |
          python -c "import openai, cv2, numpy, PIL, PySide6, manga_ocr, torch, transformers, unidic_lite; print('Dependencies OK')"

      - name: Build portable app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name MangaTranslatorPortable --collect-all manga_ocr --collect-all transformers --collect-all torch --collect-all tokenizers --collect-all unidic_lite --hidden-import fugashi --hidden-import ipadic --hidden-import openai --hidden-import cv2 main.py

      - name: Verify UniDic packaged
        shell: pwsh
        run: |
          $p = Get-ChildItem -Path dist\MangaTranslatorPortable -Recurse -Filter version | Where-Object { $_.FullName -match 'unidic_lite.*dicdir' } | Select-Object -First 1
          if (-not $p) { throw "unidic_lite dictionary was not packaged" }
          Write-Host "UniDic dictionary found at $($p.FullName)"

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\MangaTranslatorPortable\* -DestinationPath MangaTranslatorPortable.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslatorPortable
          path: MangaTranslatorPortable.zip
          if-no-files-found: error
          retention-days: 30
